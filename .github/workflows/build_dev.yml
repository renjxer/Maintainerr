name: "Build Development"

on:
  push:
    branches:
      - "development"
      - "main"
  pull_request:
    branches:
      - "development"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  guard_manual_run:
    uses: ./.github/workflows/guard-manual.yml
    with:
      enabled: ${{ github.event_name == 'workflow_dispatch' }}
      actor: ${{ github.actor }}
      source: manual workflow run

  build_docker_image:
    name: Build ${{ matrix.platform }}
    needs: guard_manual_run
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare
        if: github.event_name != 'pull_request'
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 【绝杀点 1】让 Docker meta 只负责生成版本标签(Labels)，不再让它碰镜像名称(images)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=raw,value=development

      - name: Log in to GitHub Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: >-
          ${{
            github.event_name == 'pull_request' &&
            'Build image' ||
            'Build & push by digest'
          }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION_TAG=development
          labels: ${{ steps.meta.outputs.labels }}
          # 【绝杀点 2】直接在这里用全小写死写你的镜像目标，天王老子来也变不回大写！
          outputs: >-
            type=image,"name=ghcr.io/renjxer/maintainerr",
            push-by-digest=true,name-canonical=true,
            push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Docker digests and push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build_docker_image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          echo "正在强行归并多架构纯小写官方镜像标签..."
          
          # 【绝杀点 3】最后的合并动作也全部死写成硬编码纯小写，杜绝一切由于变量带来的不确定性
          docker buildx imagetools create \
            --tag "ghcr.io/renjxer/maintainerr:development" \
            $(printf 'ghcr.io/renjxer/maintainerr@sha256:%s ' *)
