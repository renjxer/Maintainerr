name: "Dev Docker Image"

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: '可选固定标签（例如 "blahblah-dev"）。留空则默认使用分支名。'
        required: false
        default: ""

env:
  # 【修改点 1】废除原作者的 Docker Hub，仅保留你自己的 GHCR（自动获取你的用户名/仓库名）
  GHCR_SLUG: ghcr.io/${{ github.repository }}

jobs:
  build-docker-image:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            raw="$INPUT_TAG"
          else
            raw="${GITHUB_REF_NAME}"
          fi

          # 转换为符合 Docker 标签规范的小写及符号
          tag="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using tag: $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动继承你的权限，免配置

      # 【修改点 2】删除了原来的 Log in to Docker Hub 步骤，防止因没有密码报错

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # 【修改点 3】移除了镜像输出里的 DOCKERHUB_SLUG，仅保留 GHCR 输出
          outputs: type=image,"name=${{ env.GHCR_SLUG }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION_TAG=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Digest: $digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

    outputs:
      tag: ${{ steps.vars.outputs.tag }}

  merge:
    name: Merge Docker digests and push dev tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - build-docker-image

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 【修改点 4】删除了 merge 里的 Login to Docker Hub 步骤

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          TAG: ${{ needs.build-docker-image.outputs.tag }}
        run: |
          echo "Pushing multi-arch dev tag: $TAG"

          # 【修改点 5】删除了针对 Docker Hub 的 imagetools create 操作，仅保留 GHCR
          docker buildx imagetools create \
            --tag "${{ env.GHCR_SLUG }}:${TAG}" \
            $(printf '${{ env.GHCR_SLUG }}@sha256:%s ' *)
